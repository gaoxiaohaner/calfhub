data:[{n:'丑小鸭',en:'THE UGLY DUCKLING',lat:55.68,lon:12.57,c:'nord',loc:'🇩🇰 丹麦',author:'安徒生',s:'被鸭群嘲笑的丑小鸭经历无数次排挤后，发现自己原来是白天鹅。不要以貌取人，每个人都有独特价值。'},{n:'卖火柴的小女孩',en:'THE LITTLE MATCH GIRL',lat:55.68,lon:12.57,c:'nord',loc:'🇩🇰 丹麦',author:'安徒生',s:'除夕夜寒风中，小女孩一根根划燃火柴取暖。火柴带给她温暖的幻象：火炉、烤鹅、祖母。最终她在幻象中含笑离世。'},{n:'海的女儿',en:'THE LITTLE MERMAID',lat:55.68,lon:12.57,c:'nord',loc:'🇩🇰 丹麦',author:'安徒生',s:'小美人鱼用嗓音换双腿去爱王子，每步如踩刀尖。王子却爱上了别人。她选择放弃化为泡沫，因善良获得永恒灵魂。'},{n:'皇帝的新装',en:"EMPEROR'S NEW CLOTHES",lat:55.68,lon:12.57,c:'nord',loc:'🇩🇰 丹麦',author:'安徒生',s:'骗子声称能织出只有聪明人才能看见的布料。游行时一个孩子喊：他什么也没穿！戳破了所有伪装。'},{n:'拇指姑娘',en:'THUMBELINA',lat:55.68,lon:12.57,c:'nord',loc:'🇩🇰 丹麦',author:'安徒生',s:'拇指大的小姑娘被癞蛤蟆偷走，经历种种冒险。她救了冻僵的燕子，春天燕子带她飞向南方，在花朵中找到了花之王子。'},{n:'冰雪女王',en:'THE SNOW QUEEN',lat:55.68,lon:12.57,c:'nord',loc:'🇩🇰 丹麦',author:'安徒生',s:'魔镜碎片飞入男孩眼睛让他冷酷无情。格尔达历经千难万险，用热泪融化冰雪碎片救回了他。'},{n:'白雪公主',en:'SNOW WHITE',lat:50.94,lon:6.96,c:'germ',loc:'🇩🇪 德国',author:'格林兄弟',s:'被嫉妒的继母追杀，逃入森林与七个小矮人为伴。被毒苹果毒倒后，王子的真爱之吻让她苏醒。'},{n:'灰姑娘',en:'CINDERELLA',lat:50.94,lon:6.96,c:'germ',loc:'🇩🇪 德国',author:'格林兄弟',s:'被继母虐待的灰姑娘，仙女教母变出南瓜马车送她参加舞会。午夜匆忙离去留下水晶鞋，王子凭鞋找到了她。'},{n:'青蛙王子',en:'THE FROG PRINCE',lat:50.94,lon:6.96,c:'germ',loc:'🇩🇪 德国',author:'格林兄弟',s:'公主的金球掉入深井，青蛙帮她取回。公主将他摔到墙上，青蛙变回了英俊的王子。'},{n:'长发公主',en:'RAPUNZEL',lat:50.94,lon:6.96,c:'germ',loc:'🇩🇪 德国',author:'格林兄弟',s:'被关在高塔中的公主，金色长发垂地作梯子。王子攀发登塔相爱，女巫剪断长发放逐公主。'},{n:'汉塞尔与格莱特',en:'HANSEL AND GRETEL',lat:50.94,lon:6.96,c:'germ',loc:'🇩🇪 德国',author:'格林兄弟',s:'被遗弃在森林的兄妹发现糖果屋。格莱特骗老巫婆推进烤炉，兄妹带着宝石回家。'},{n:'睡美人',en:'SLEEPING BEAUTY',lat:50.94,lon:6.96,c:'germ',loc:'🇩🇪 德国',author:'格林兄弟',s:'公主被纺锤刺伤沉睡百年。王子穿过荆棘，用真爱之吻唤醒了公主和整个城堡。'},{n:'美女与野兽',en:'BEAUTY AND THE BEAST',lat:48.86,lon:2.35,c:'fr',loc:'🇫🇷 法国',author:'维伦纽夫夫人',s:'善良的贝儿为救父亲留在城堡陪伴野兽。真爱之泪解除诅咒，野兽变回王子。'},{n:'小红帽',en:'LITTLE RED RIDING HOOD',lat:48.86,lon:2.35,c:'fr',loc:'🇫🇷 法国',author:'佩罗',s:'穿红色斗篷的小女孩去看望外婆。大灰狼伪装成外婆。幸好猎人赶到救出了她们。'},{n:'三只小猪',en:'THE THREE LITTLE PIGS',lat:51.5,lon:-0.12,c:'uk',loc:'🇬🇧 英国',author:'英国民间',s:'三只小猪用稻草、木头、砖头建屋。砖头屋坚固无比，团结一致吓跑了狼。'},{n:'杰克与魔豆',en:'JACK AND THE BEANSTALK',lat:51.5,lon:-0.12,c:'uk',loc:'🇬🇧 英国',author:'英国民间',s:'杰克用唯一的牛换来魔豆，一夜长成参天巨藤。爬上发现巨人城堡，偷走金蛋鹅。'},{n:'罗宾汉',en:'ROBIN HOOD',lat:53,lon:-1.15,c:'uk',loc:'🇬🇧 诺丁汉',author:'英国中世纪',s:'绿林好汉罗宾汉在舍伍德森林劫富济贫。'},{n:'木偶奇遇记',en:'PINOCCHIO',lat:43.77,lon:11.25,c:'it',loc:'🇮🇹 意大利',author:'科洛迪',s:'小木偶匹诺曹说谎鼻子变长。经历种种冒险，学会诚实勇敢善良，变成真正的男孩。'},{n:'阿拉丁神灯',en:'ALADDIN',lat:25.29,lon:51.53,c:'arab',loc:'🇶🇦 中东',author:'一千零一夜',s:'贫穷少年阿拉丁获得神灯和魔戒。灯中精灵帮他实现愿望，打败魔法师救出公主。'},{n:'阿里巴巴',en:'ALI BABA',lat:25.29,lon:51.53,c:'arab',loc:'🇶🇦 中东',author:'一千零一夜',s:'樵夫发现"芝麻开门"的藏宝山洞。女仆莫吉安娜用计挫败强盗阴谋。'},{n:'辛巴达航海记',en:'VOYAGES OF SINBAD',lat:25.29,lon:51.53,c:'arab',loc:'🇶🇦 中东',author:'一千零一夜',s:'辛巴达七次航海遭遇巨鸟、独眼巨人，每次凭智慧勇气化险为夷。'},{n:'渔夫与魔鬼',en:'FISHERMAN AND JINNI',lat:25.29,lon:51.53,c:'arab',loc:'🇶🇦 中东',author:'一千零一夜',s:'渔夫用激将法骗魔鬼重回瓶中，封上了瓶盖。'},{n:'一千零一夜',en:'ARABIAN NIGHTS',lat:25.29,lon:51.53,c:'arab',loc:'🇶🇦 中东',author:'阿拉伯民间',s:'山鲁佐德每晚讲故事给国王听。一千零一夜后国王被感动，撤销了残忍命令。'},{n:'桃太郎',en:'MOMOTARO',lat:35.0,lon:135.77,c:'jp',loc:'🇯🇵 日本',author:'日本民间',s:'桃子里蹦出的男孩桃太郎，带着狗、猴、鸡去鬼岛打鬼，带回财宝。'},{n:'辉夜姬',en:'PRINCESS KAGUYA',lat:34.96,lon:135.77,c:'jp',loc:'🇯🇵 日本',author:'竹取物语',s:'竹子里发现的美丽女孩，月圆之夜被月宫使者接走。'},{n:'鹤妻',en:'CRANE WIFE',lat:35.2,lon:135.77,c:'jp',loc:'🇯🇵 日本',author:'日本民间',s:'鹤化为女子嫁恩人，用自己羽毛织出精美织锦。丈夫偷看被发现，鹤妻悲伤飞走。'},{n:'白蛇传',en:'LEGEND OF WHITE SNAKE',lat:30.24,lon:120.16,c:'cn',loc:'🇨🇳 杭州',author:'中国民间',s:'白蛇精白素贞与许仙在西湖断桥相爱。法海识破真身，白素贞水漫金山被镇压雷峰塔下。'},{n:'牛郎织女',en:'COWHERD AND WEAVER GIRL',lat:34.27,lon:108.87,c:'cn',loc:'🇨🇳 西安',author:'中国民间',s:'牛郎与织女相爱。王母划银河隔开。每年七夕喜鹊搭桥让他们相会。'},{n:'嫦娥奔月',en:"CHANG'E FLIES TO MOON",lat:34.41,lon:108.98,c:'cn',loc:'🇨🇳 西安',author:'中国上古',s:'嫦娥误食不死药飞向月宫。后羿月下设香案遥望妻子，中秋祭月由此而来。'},{n:'花木兰',en:'MULAN',lat:39.9,lon:116.41,c:'cn',loc:'🇨🇳 北京',author:'木兰辞',s:'木兰女扮男装代父从军十二年。归来脱战袍换女装，不知木兰是女郎！'},{n:'孙悟空',en:'THE MONKEY KING',lat:34.17,lon:108.95,c:'cn',loc:'🇨🇳 西安',author:'西游记',s:'美猴王大闹天宫。被压五行山下五百年，后随唐僧西天取经。'},{n:'梁祝',en:'BUTTERFLY LOVERS',lat:30.27,lon:120.16,c:'cn',loc:'🇨🇳 杭州',author:'中国民间',s:'祝英台女扮男装与梁山伯同窗三年。英台跃入坟墓，两人化为蝴蝶。'},{n:'春香传',en:'TALE OF CHUNHYANG',lat:35.18,lon:126.78,c:'kr',loc:'🇰🇷 韩国',author:'韩国古典',s:'春香与李梦龙相爱。贪官逼她做妾，梦龙考取功名惩治贪官。'},{n:'伊索寓言',en:"AESOP'S FABLES",lat:37.98,lon:23.73,c:'gr',loc:'🇬🇷 希腊',author:'伊索',s:'龟兔赛跑、狐狸与葡萄等经典寓言。揭示人性弱点和生活哲理。'},{n:'阿南西蜘蛛',en:'ANANSI THE SPIDER',lat:5.6,lon:-0.19,c:'afr',loc:'🇬🇭 加纳',author:'阿坎族传说',s:'蜘蛛阿南西凭智慧从天神手中偷来所有故事。'},{n:'绿野仙踪',en:'THE WIZARD OF OZ',lat:37.68,lon:-97.33,c:'us',loc:'🇺🇸 堪萨斯',author:'鲍姆',s:'桃乐丝被龙卷风带到奥兹国。与稻草人、铁皮人、狮子一起冒险。'},{n:'汤姆·索亚',en:'TOM SAWYER',lat:36.16,lon:-95.99,c:'us',loc:'🇺🇸 密西西比',author:'马克·吐温',s:'调皮男孩汤姆在密西西比河畔冒险。'}]},

/* ═══ 工具函数 ═══ */
function latLon2Vec3(lat,lon,r){const phi=(90-lat)*Math.PI/180,theta=(lon+180)*Math.PI/180;return new THREE.Vector3(-r*Math.sin(phi)*Math.cos(theta),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(theta));}
function glowTex(hex,s=64){const c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');const col=new THREE.Color(hex);const r=col.r*255|0,g=col.g*255|0,b=col.b*255|0;const gd=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);gd.addColorStop(0,`rgba(${r},${g},${b},1)`);gd.addColorStop(.35,`rgba(${r},${g},${b},.4)`);gd.addColorStop(1,`rgba(${r},${g},${b},0)`);x.fillStyle=gd;x.fillRect(0,0,s,s);return new THREE.CanvasTexture(c);}

/* ═══ 程序化地球纹理 ═══ */
function genEarthTex(w=2048,h=1024){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');const proj=(lo,la)=>[(lo+180)/360*w,(90-la)/180*h];
const og=x.createLinearGradient(0,0,0,h);og.addColorStop(0,'#040e1e');og.addColorStop(.5,'#0c2850');og.addColorStop(1,'#040e1e');x.fillStyle=og;x.fillRect(0,0,w,h);
for(let i=0;i<500;i++){const px=Math.random()*w,py=Math.random()*h,r=20+Math.random()*80;const g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,`rgba(15,55,115,${.02+Math.random()*.02})`);g.addColorStop(1,'rgba(15,55,115,0)');x.fillStyle=g;x.fillRect(px-r,py-r,r*2,r*2);}

document.getElementById('i-nm').textContent=p.n;document.getElementById('i-en').textContent=p.en;
const fc=document.getElementById('i-f');fc.innerHTML='';mode.fields.forEach(f=>{if(p[f.k]){const d=document.createElement('div');d.className='fld';d.innerHTML=`<div class="fl">${f.l}</div><div class="fv${f.story?' st':''}">${p[f.k]}</div>`;fc.appendChild(d)}});
document.getElementById('i-lo').textContent=`📍 ${p.loc}`;document.getElementById('i-cd').textContent=`🌐 ${p.lat.toFixed(2)}°${p.lat>0?'N':'S'} ${Math.abs(p.lon).toFixed(2)}°${p.lon>0?'E':'W'}`;document.getElementById('i-sz').style.display=p.sz?'block':'none';document.getElementById('info').classList.add('vis');}
window.closeInfo=()=>document.getElementById('info').classList.remove('vis');

/* ═══ 缩放 & 深圳（★ FIX: 考虑旋转 + 聚焦期间暂停自转） ═══ */
window.zoomIn=()=>{const d=camera.position.clone().normalize();if(camera.position.length()>controls.minDistance+.5)camera.position.sub(d.multiplyScalar(1.5))};
window.zoomOut=()=>{const d=camera.position.clone().normalize();if(camera.position.length()<controls.maxDistance-.5)camera.position.add(d.multiplyScalar(1.5))};
window.resetView=()=>{camera.position.set(0,3,18);controls.target.set(0,0,0);controls.update()};
let autoRot=true;window.toggleAuto=()=>{autoRot=!autoRot;controls.autoRotate=autoRot;document.getElementById('rb').style.opacity=autoRot?'1':'.3'};
let szAnim=false,focusRotating=false;
window.focusSZ=()=>{
if(szAnim||!markerGroup)return;
szAnim=true;focusRotating=true;controls.autoRotate=false;
// ★ FIX: 用世界坐标（考虑 markerGroup 旋转）
markerGroup.updateMatrixWorld();
let szWorldPos=null;
for(const m of markers){if(m.isSZ&&m.position){szWorldPos=m.position.clone().applyMatrix4(markerGroup.matrixWorld);break;}}
if(!szWorldPos){szAnim=false;focusRotating=false;return;}
const szNrm=szWorldPos.clone().normalize();
const tc=szNrm.clone().multiplyScalar(10).add(new THREE.Vector3(1.5,2.5,1.5));
const sc=camera.position.clone(),st=controls.target.clone(),et=szWorldPos.clone().multiplyScalar(.25);
const dur=1800,st2=performance.now();
(function anim(now){const t=Math.min((now-st2)/dur,1);const e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
camera.position.lerpVectors(sc,tc,e);controls.target.lerpVectors(st,et,e);controls.update();
if(t<1)requestAnimationFrame(anim);else{szAnim=false;focusRotating=false;if(autoRot)controls.autoRotate=true;}})(performance.now());
setTimeout(()=>{for(let i=0;i<markers.length;i++)if(markers[i].isSZ){showInfo(i);for(let k=0;k<4;k++)setTimeout(()=>spawnWave(markers[i].position,markers[i].normal,0xffd700),k*200);break}},dur*.6);};

window.addEventListener('keydown',e=>{switch(e.key){case'+':case'=':zoomIn();break;case'-':case'_':zoomOut();break;case'r':case'R':resetView();break;case's':case'S':focusSZ();break;case' ':toggleAuto();e.preventDefault();break}});
let lastTD=0;renderer.domElement.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;const d=Math.sqrt(dx*dx+dy*dy);if(lastTD>0){if(d>lastTD)zoomIn();else zoomOut()}lastTD=d}},{passive:false});renderer.domElement.addEventListener('touchend',()=>lastTD=0);

/* ═══ 动画（★ FIX: 聚焦期间暂停地球旋转） ═══ */
let waveTimer=0;
function animate(){
requestAnimationFrame(animate);
const dt=clock.getDelta(),t=clock.getElapsedTime();
eU.uTime.value=t;
// ★ FIX: 聚焦期间地球不旋转，但标记仍可脉冲
const rot=focusRotating?0:dt*.032;
earth.rotation.y+=rot;atmo.rotation.y+=rot;clouds.rotation.y+=rot*.5;
if(markerGroup)markerGroup.rotation.y+=rot;
waveGroup.rotation.y+=rot;

markers.forEach((m,i)=>{if(!m||!m.sprite)return;const pulse=Math.sin(t*2+i*.58)*.5+.5;const sz=m.isSZ?1.3:1;
m.sprite.scale.setScalar((.35+pulse*.22)*sz);m.sprite.material.opacity=.38+pulse*.35;
m.ring.scale.setScalar((1+pulse*.3)*sz);m.ring.material.opacity=.18+pulse*.28;
m.beam.material.opacity=.08+pulse*.12;});

waveTimer+=dt;
if(waveTimer>.8&&markers.length){waveTimer=0;const m=markers[Math.random()*markers.length|0];if(m&&m.position)spawnWave(m.position,m.normal,m.isSZ?0xffd700:m.cat.c);}

for(let i=waves.length-1;i>=0;i--){const w=waves[i];w.age+=dt;const prog=w.age/w.maxAge;
if(prog>=1){waveGroup.remove(w.mesh);w.mesh.geometry.dispose();w.mesh.material.dispose();waves.splice(i,1)}
else{const s=1+prog*6;w.mesh.scale.setScalar(s);w.mesh.position.copy(w.basePos).add(w.nrm.clone().multiplyScalar(prog*.3));w.mesh.material.opacity=.4*(1-prog)*(1-prog*.3);}}

const lp=lanterns.geometry.attributes.position.array;
for(let i=0;i<LN;i++){lAng[i]+=lSpd[i]*dt;lY[i]+=.2*dt;if(lY[i]>R*1.5)lY[i]=-R*.5;lp[i*3]=lRad[i]*Math.cos(lAng[i]);lp[i*3+1]=lY[i]+Math.sin(t*.4+lWob[i])*.25;lp[i*3+2]=lRad[i]*Math.sin(lAng[i])}
lanterns.geometry.attributes.position.needsUpdate=true;

const bp=blueP.geometry.attributes.position.array;
for(let i=0;i<PC;i++){pAng[i]+=pSpd[i]*dt;bp[i*3]=pRad[i]*Math.cos(pAng[i]);bp[i*3+1]=pY2[i]+Math.sin(t*.3+i*.1)*.3;bp[i*3+2]=pRad[i]*Math.sin(pAng[i])}
blueP.geometry.attributes.position.needsUpdate=true;

const dist=camera.position.length();
document.getElementById('zl').textContent=Math.max(10,Math.min(200,Math.round(((controls.maxDistance-dist)/(controls.maxDistance-controls.minDistance))*100)))+'%';

controls.update();
if(markerGroup){markerGroup.updateMatrixWorld();
markers.forEach((m,i)=>{if(!m||!m.position||!labelEls[i])return;
const wp=m.position.clone().applyMatrix4(markerGroup.matrixWorld);
const sp=wp.clone().project(camera);
const x=(sp.x*.5+.5)*innerWidth,y=(-sp.y*.5+.5)*innerHeight;
const toCam=camera.position.clone().sub(wp).normalize();
const nw=m.normal.clone().transformDirection(markerGroup.matrixWorld);
const dot=nw.dot(toCam);const el=labelEls[i];
const catKey=Object.keys(MODES[currentMode].cats).find(k=>MODES[currentMode].cats[k]===m.cat);
if(dot>.1&&sp.z<1&&(m.isSZ||activeCats.has(catKey))){
el.style.display='block';el.style.left=x+'px';el.style.top=(y-18)+'px';
el.style.transform='translate(-50%,-100%)';el.style.opacity=Math.min(1,dot*2.5)
}else el.style.display='none';});}

renderer.render(scene,camera);}

/* ═══ 启动（★ FIX: 直接构建，不依赖 switchMode 的早返回） ═══ */
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
let lprog=0;const lint=setInterval(()=>{lprog+=Math.random()*12+5;if(lprog>=100){lprog=100;clearInterval(lint)}document.getElementById('lf').style.width=lprog+'%'},120);

setTimeout(()=>{
document.getElementById('loading').classList.add('hidden');
buildModeBar();
// ★ FIX: 用 force=true 强制初始构建
switchMode('plant',true);
setTimeout(()=>focusSZ(),2800);
},1500);

animate();
</script>
</body>
</html>
